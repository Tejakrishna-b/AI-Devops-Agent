# Configuration file for AI DevOps Upgrade Agent
# Sensitive values should be set via environment variables:
#   JIRA_URL, JIRA_USERNAME, JIRA_API_TOKEN
#   GITHUB_TOKEN
#   OPENAI_API_KEY
#   SONARQUBE_TOKEN

jira:
  url: "https://your-instance.atlassian.net"
  username: "your-email@example.com"
  api_token: ""  # Set JIRA_API_TOKEN env var instead

git:
  provider: "github"
  repo: "AI-Devops-Agent"
  token: ""  # Set GITHUB_TOKEN env var instead
  owner: "Tejakrishna-b"

sonarqube:
  url: "https://sonarqube.company.com"
  token: ""  # Set SONARQUBE_TOKEN env var instead

openai:
  api_key: ""  # Set OPENAI_API_KEY env var instead
  model: "gpt-4"

workspace_dir: "workspace"
